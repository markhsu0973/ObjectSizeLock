name: Build unsigned iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download Core ML model from project release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/model" Sources/Models
          gh release download v1.1-model \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'ostrack_vitb384.mlpackage.zip' \
            --dir "$RUNNER_TEMP/model"
          unzip -q "$RUNNER_TEMP/model/ostrack_vitb384.mlpackage.zip" -d Sources/Models
          test -f Sources/Models/ostrack_vitb384.mlpackage/Manifest.json
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned device app
        run: |
          xcodebuild -project ObjectSizeLock.xcodeproj \
            -scheme ObjectSizeLock -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Check bundled model and pack unsigned IPA
        run: |
          APP="$RUNNER_TEMP/build/Build/Products/Release-iphoneos/ObjectSizeLock.app"
          test -d "$APP/ostrack_vitb384.mlmodelc" || { echo 'Missing compiled Core ML model'; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -q -r ObjectSizeLock-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ObjectSizeLock-unsigned-IPA
          path: ObjectSizeLock-unsigned.ipa
          if-no-files-found: error
