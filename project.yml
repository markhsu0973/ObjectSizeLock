name: ObjectSizeLock
options:
  bundleIdPrefix: com.opensource.objectlock
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  ObjectSizeLock:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Object Size Lock
        NSCameraUsageDescription: Camera is used to track a selected object and record video.
        NSMicrophoneUsageDescription: Microphone is used while recording video.
        NSPhotoLibraryAddUsageDescription: Save the captured video to Photos.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opensource.objectlock.app
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
